# Xiaomi Mi 5 (gemini) - build settings for Ubuntu 26.04
# Every script sources this file. Override any value with an environment
# variable, e.g.  UBUNTU_SUITE=resolute KERNEL_TAG=v6.19.5-msm8996 ./build.sh

# ---- Device ---------------------------------------------------------------
DEVICE_NAME="Xiaomi Mi 5"
DEVICE_CODENAME="gemini"
DTB_NAME="${DTB_NAME:-qcom/msm8996-xiaomi-gemini}"

# ---- Ubuntu ---------------------------------------------------------------
UBUNTU_SUITE="${UBUNTU_SUITE:-resolute}"           # 26.04 LTS
UBUNTU_MIRROR="${UBUNTU_MIRROR:-http://ports.ubuntu.com/ubuntu-ports}"
HOSTNAME_DEFAULT="${HOSTNAME_DEFAULT:-xiaomi-gemini}"
DEFAULT_USER="${DEFAULT_USER:-ubuntu}"
DEFAULT_PASSWORD="${DEFAULT_PASSWORD:-ubuntu}"      # forced to change at first login
LOCALE_DEFAULT="${LOCALE_DEFAULT:-en_US.UTF-8}"
TIMEZONE_DEFAULT="${TIMEZONE_DEFAULT:-Etc/UTC}"

# Which on-screen keyboard / UI to install:
#   console  - text console + buffyboard on-screen keyboard (default, server)
#   sway     - console + a minimal touch GUI: sway + foot terminal + wvkbd
#   phosh    - console + full phone shell (phosh + squeekboard), heavier
UI="${UI:-console}"

# ---- Kernel ---------------------------------------------------------------
# msm8996-mainline kernel: mainline + extra patches for MSM8996 phones
# (battery fuel gauge, PMI8994 charger, audio, camera, ...).
KERNEL_REPO="${KERNEL_REPO:-https://gitlab.com/msm8996-mainline/linux.git}"
KERNEL_TAG="${KERNEL_TAG:-v6.19.5-msm8996}"
KERNEL_LOCALVERSION="${KERNEL_LOCALVERSION:--gemini}"
CROSS_COMPILE="${CROSS_COMPILE:-aarch64-linux-gnu-}"

# ---- Boot image (Xiaomi LK / aboot, Android boot image v0) --------------
BOOT_BASE="0x80000000"
BOOT_KERNEL_OFFSET="0x00008000"
BOOT_RAMDISK_OFFSET="0x01000000"
BOOT_SECOND_OFFSET="0x00f00000"
BOOT_TAGS_OFFSET="0x00000100"
BOOT_PAGESIZE="4096"
BOOT_PARTITION_MAX_BYTES="$((64 * 1024 * 1024))"   # Mi 5 boot partition = 64 MiB

ROOTFS_LABEL="gemini-root"
KERNEL_CMDLINE="${KERNEL_CMDLINE:-root=LABEL=${ROOTFS_LABEL} rootwait rw console=tty0 loglevel=4 fbcon=font:TER16x32}"

# ---- Rootfs image ---------------------------------------------------------
ROOTFS_IMAGE_SIZE="${ROOTFS_IMAGE_SIZE:-4G}"   # grows to the full userdata partition on first boot

# ---- Paths ----------------------------------------------------------------
TOP_DIR="${TOP_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)}"
WORK_DIR="${WORK_DIR:-${TOP_DIR}/work}"
OUT_DIR="${OUT_DIR:-${TOP_DIR}/out}"
KERNEL_SRC="${KERNEL_SRC:-${WORK_DIR}/linux}"
KERNEL_BUILD="${KERNEL_BUILD:-${WORK_DIR}/kernel-build}"
KERNEL_STAGE="${KERNEL_STAGE:-${WORK_DIR}/kernel-stage}"
ROOTFS_DIR="${ROOTFS_DIR:-${WORK_DIR}/rootfs}"
FIRMWARE_DIR="${FIRMWARE_DIR:-${TOP_DIR}/firmware}"   # device-specific blobs (not in git)
