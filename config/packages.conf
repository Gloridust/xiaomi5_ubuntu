# Package lists for the Ubuntu 26.04 rootfs (bash arrays, sourced by
# scripts/20-build-rootfs.sh). Recommends are not installed.

PKGS_BASE=(
	# Ubuntu server base
	ubuntu-minimal ubuntu-standard systemd-sysv systemd-resolved dbus udev
	sudo bash-completion locales tzdata ca-certificates apparmor
	unattended-upgrades needrestart
	openssh-server curl wget less nano vim-tiny htop rsync
	usbutils pciutils lsof strace file
	# boot: initramfs + Android boot image tool
	initramfs-tools zstd kmod mkbootimg e2fsprogs
	# networking: WiFi (QCA6174 / ath10k) via NetworkManager, USB networking via networkd
	network-manager wpasupplicant iw wireless-regdb rfkill netplan.io
	iproute2 iputils-ping nftables
	# firmware from linux-firmware: WiFi/BT (QCA6174) and GPU (Adreno 530)
	linux-firmware-qualcomm-wireless linux-firmware-qualcomm-graphics
	# Bluetooth
	bluez
	# Qualcomm DSPs: modem storage, QRTR tools, modem userspace
	rmtfs qrtr-tools tqftpserv protection-domain-mapper modemmanager libqmi-utils
	# audio (WCD9335 codec through the ADSP)
	alsa-utils alsa-ucm-conf
	# console UI: big font, on-screen keyboard, power key handling
	kbd console-setup buffyboard python3 python3-evdev
	# battery/power tools, compressed RAM swap, input debugging
	upower brightnessctl systemd-zram-generator evtest libinput-tools
	# text menu, rescue hotspot, and tools Claude Code works well with
	whiptail dnsmasq-base tmux git ripgrep jq
)

PKGS_UI_SWAY=(
	sway swayidle swaylock foot wvkbd i3status
	fonts-dejavu-core libgl1-mesa-dri libegl-mesa0 mesa-vulkan-drivers
	pipewire wireplumber pipewire-pulse polkitd
)

PKGS_UI_PHOSH=(
	phosh phoc squeekboard phosh-mobile-settings gnome-console
	fonts-cantarell libgl1-mesa-dri libegl-mesa0 mesa-vulkan-drivers
	pipewire wireplumber pipewire-pulse polkitd
)
