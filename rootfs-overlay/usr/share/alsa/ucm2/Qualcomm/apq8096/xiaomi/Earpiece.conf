# Common earpiece configuration for Xiaomi MSM8996 devices

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='RX4 Digital Volume' 68"
	]

	DisableSequence [
		cset "name='RX4 Digital Volume' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},1" # MultiMedia2
		PlaybackChannels 1
	}
}
