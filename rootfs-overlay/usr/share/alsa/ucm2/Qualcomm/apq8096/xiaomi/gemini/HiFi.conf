# HiFi use case configuration for Xiaomi Mi 5.

Include.hifi.File "/Qualcomm/apq8096/xiaomi/HiFi.conf"
Include.hp.File "/Qualcomm/apq8096/xiaomi/Headphones.conf"
Include.ear.File "/Qualcomm/apq8096/xiaomi/Earpiece.conf"
Include.hpmic.File "/Qualcomm/apq8096/xiaomi/Headphones Mic.conf"

SectionDevice."Handset" {
	Comment "Handset Microphone"

	EnableSequence [
		cset "name='ADC1 Volume' 20"
	]

	DisableSequence [
		cset "name='ADC1 Volume' 0"
	]

	Value {
		CapturePCM "hw:${CardId},2" # MultiMedia3
		CaptureChannels 1
	}
}

SectionDevice."Aux1" {
	Comment "Auxiliary Microphone Top"

	EnableSequence [
		cset "name='ADC3 Volume' 20"
	]

	DisableSequence [
		cset "name='ADC3 Volume' 0"
	]

	Value {
		CapturePCM "hw:${CardId},4" # MultiMedia5
		CaptureChannels 1
	}
}

SectionDevice."Aux2" {
	Comment "Auxiliary Microphone Front"

	EnableSequence [
		cset "name='ADC4 Volume' 20"
	]

	DisableSequence [
		cset "name='ADC4 Volume' 0"
	]

	Value {
		CapturePCM "hw:${CardId},5" # MultiMedia6
		CaptureChannels 1
	}
}
