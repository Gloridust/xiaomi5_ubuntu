# Common headphones mic configuration for Xiaomi MSM8996 devices

SectionDevice."Headphones Mic" {
	Comment "Headphones Microphone"

	EnableSequence [
		cset "name='ADC2 Volume' 20"
	]

	DisableSequence [
		cset "name='ADC2 Volume' 0"
	]

	Value {
		CapturePCM "hw:${CardId},3" # MultiMedia4
		CaptureChannels 1
		CapturePriority 100
	}
}
