# Common headphones configuration for Xiaomi MSM8996 devices

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='RX5 Digital Volume' 68"
		cset "name='RX6 Digital Volume' 68"
	]

	DisableSequence [
		cset "name='RX5 Digital Volume' 0"
		cset "name='RX6 Digital Volume' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0" # MultiMedia1
		PlaybackChannels 2
	}
}
