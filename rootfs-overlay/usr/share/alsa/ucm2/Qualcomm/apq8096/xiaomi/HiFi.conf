# Common HiFi use case configuration for Xiaomi MSM8996 devices.

SectionVerb {
	EnableSequence [
		# RX
		# Output devices driven by WCD9335 are wired up identically on all devices.

		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='SLIM RX2 MUX' ZERO"
		cset "name='SLIM RX3 MUX' ZERO"
		cset "name='SLIM RX4 MUX' AIF1_PB"	# Earpiece
		cset "name='SLIM RX5 MUX' AIF4_PB"	# Headphones left channel
		cset "name='SLIM RX6 MUX' AIF4_PB"	# Headphones right channel
		cset "name='SLIM RX7 MUX' ZERO"

		cset "name='RX INT0_2 MUX' RX4"		# Earpiece
		cset "name='RX INT1_2 MUX' RX5"		# Headphones left channel
		cset "name='RX INT2_2 MUX' RX6"		# Headphones right channel

		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"		# Earpiece
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"		# Headphones left channel
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"		# Headphones right channel

		cset "name='SLIMBUS_4_RX Audio Mixer MultiMedia2' 1"	# Earpiece
		cset "name='SLIMBUS_6_RX Audio Mixer MultiMedia1' 1"	# Headphones

		# TX
		# The same input devices exist on all devices, but are wired up slightly
		# diffrently other than the headphones mic, which is connected to the
		# AMIC2 input of WCD9335 on all devices.

		cset "name='MultiMedia3 Mixer SLIMBUS_0_TX' 1"		# AMIC1
		cset "name='MultiMedia4 Mixer SLIMBUS_1_TX' 1"		# Headphones mic
		cset "name='MultiMedia5 Mixer SLIMBUS_2_TX' 1"		# AMIC3
		cset "name='MultiMedia6 Mixer SLIMBUS_3_TX' 1"		# AMIC4

		cset "name='SLIM TX0 MUX' DEC0"		# AMIC1
		cset "name='SLIM TX1 MUX' DEC1"		# Headphones mic
		cset "name='SLIM TX2 MUX' DEC2"		# AMIC3
		cset "name='SLIM TX3 MUX' DEC3"		# AMIC4

		cset "name='ADC MUX0' AMIC"		# AMIC1
		cset "name='ADC MUX1' AMIC"		# Headphones mic
		cset "name='ADC MUX2' AMIC"		# AMIC3
		cset "name='ADC MUX3' AMIC"		# AMIC4

		cset "name='AMIC MUX0' ADC1"		# AMIC1
		cset "name='AMIC MUX1' ADC2"		# Headphones mic
		cset "name='AMIC MUX2' ADC3"		# AMIC3
		cset "name='AMIC MUX3' ADC4"		# AMIC4
		
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"		# AMIC1
		cset "name='AIF1_CAP Mixer SLIM TX1' 0"
		cset "name='AIF1_CAP Mixer SLIM TX2' 0"
		cset "name='AIF1_CAP Mixer SLIM TX3' 0"
		cset "name='AIF1_CAP Mixer SLIM TX4' 0"
		cset "name='AIF1_CAP Mixer SLIM TX5' 0"
		cset "name='AIF1_CAP Mixer SLIM TX6' 0"
		cset "name='AIF1_CAP Mixer SLIM TX7' 0"
		cset "name='AIF1_CAP Mixer SLIM TX8' 0"

		cset "name='AIF2_CAP Mixer SLIM TX0' 0"
		cset "name='AIF2_CAP Mixer SLIM TX1' 1"		# Headphones mic
		cset "name='AIF2_CAP Mixer SLIM TX2' 0"
		cset "name='AIF2_CAP Mixer SLIM TX3' 0"
		cset "name='AIF2_CAP Mixer SLIM TX4' 0"
		cset "name='AIF2_CAP Mixer SLIM TX5' 0"
		cset "name='AIF2_CAP Mixer SLIM TX6' 0"
		cset "name='AIF2_CAP Mixer SLIM TX7' 0"
		cset "name='AIF2_CAP Mixer SLIM TX8' 0"

		cset "name='AIF3_CAP Mixer SLIM TX0' 0"
		cset "name='AIF3_CAP Mixer SLIM TX1' 0"
		cset "name='AIF3_CAP Mixer SLIM TX2' 1"		# AMIC3
		cset "name='AIF3_CAP Mixer SLIM TX3' 0"
		cset "name='AIF3_CAP Mixer SLIM TX4' 0"
		cset "name='AIF3_CAP Mixer SLIM TX5' 0"
		cset "name='AIF3_CAP Mixer SLIM TX6' 0"
		cset "name='AIF3_CAP Mixer SLIM TX7' 0"
		cset "name='AIF3_CAP Mixer SLIM TX8' 0"

		cset "name='AIF4_CAP Mixer SLIM TX0' 0"
		cset "name='AIF4_CAP Mixer SLIM TX1' 0"
		cset "name='AIF4_CAP Mixer SLIM TX2' 0"
		cset "name='AIF4_CAP Mixer SLIM TX3' 1"		# AMIC4
		cset "name='AIF4_CAP Mixer SLIM TX4' 0"
		cset "name='AIF4_CAP Mixer SLIM TX5' 0"
		cset "name='AIF4_CAP Mixer SLIM TX6' 0"
		cset "name='AIF4_CAP Mixer SLIM TX7' 0"
		cset "name='AIF4_CAP Mixer SLIM TX8' 0"
	]

	DisableSequence [
		# TX
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='AIF2_CAP Mixer SLIM TX1' 0"
		cset "name='AIF3_CAP Mixer SLIM TX2' 0"
		cset "name='AIF4_CAP Mixer SLIM TX3' 0"

		cset "name='AMIC MUX0' ZERO"
		cset "name='AMIC MUX1' ZERO"
		cset "name='AMIC MUX2' ZERO"
		cset "name='AMIC MUX3' ZERO"

		cset "name='SLIM TX0 MUX' ZERO"
		cset "name='SLIM TX1 MUX' ZERO"
		cset "name='SLIM TX2 MUX' ZERO"
		cset "name='SLIM TX3 MUX' ZERO"

		cset "name='MultiMedia3 Mixer SLIMBUS_0_TX' 0"
		cset "name='MultiMedia4 Mixer SLIMBUS_1_TX' 0"
		cset "name='MultiMedia5 Mixer SLIMBUS_2_TX' 0"
		cset "name='MultiMedia6 Mixer SLIMBUS_3_TX' 0"

		# RX
		cset "name='SLIMBUS_4_RX Audio Mixer MultiMedia2' 0"
		cset "name='SLIMBUS_6_RX Audio Mixer MultiMedia1' 0"	

		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"

		cset "name='SLIM RX4 MUX' ZERO"
		cset "name='SLIM RX5 MUX' ZERO"
		cset "name='SLIM RX6 MUX' ZERO"
	]
}
