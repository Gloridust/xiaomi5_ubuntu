general {
	colors = true
	interval = 5
	output_format = "i3bar"
}
order += "cpu_usage"
order += "memory"
order += "wireless _first_"
order += "battery 0"
order += "tztime local"
cpu_usage {
	format = "CPU %usage"
	degraded_threshold = 90
	max_threshold = 95
}
memory {
	format = "RAM %percentage_used"
	threshold_degraded = "10%"
	threshold_critical = "5%"
}
wireless _first_ {
	format_up = "%essid %quality"
	format_down = "no wifi"
}
# "battery all" looks for BAT*; the Mi 5's fuel gauge is called qcom-battery
battery 0 {
	path = "/sys/class/power_supply/qcom-battery/uevent"
	format = "%status %percentage"
	format_down = "no battery"
	status_chr = "CHG"
	status_bat = "BAT"
	status_full = "FULL"
	status_unk = "BAT"
	low_threshold = 15
	threshold_type = percentage
	last_full_capacity = true
	integer_battery_capacity = true
}
tztime local {
	format = "%H:%M"
}
