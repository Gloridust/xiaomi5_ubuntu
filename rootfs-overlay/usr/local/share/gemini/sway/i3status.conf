general {
	colors = true
	interval = 10
}
order += "wireless _first_"
order += "battery all"
order += "tztime local"
wireless _first_ {
	format_up = "%essid %quality"
	format_down = "no wifi"
}
battery all {
	format = "%status %percentage"
	last_full_capacity = true
}
tztime local {
	format = "%H:%M"
}
