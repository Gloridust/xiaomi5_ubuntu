name: Build Mi 5 Ubuntu images

# Every push to the default branch: quick tests -> full build -> QEMU boot
# test -> if everything passed, a GitHub release with the TWRP zip and the
# fastboot images. Docs-only changes don't trigger a build.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      ui:
        description: 'On-screen keyboard / UI'
        type: choice
        options: [sway, console, phosh]
        default: sway

permissions:
  contents: write   # create releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck device-tree-compiler python3 busybox-static e2fsprogs
      - name: Shellcheck
        run: |
          shellcheck -x -S warning build.sh scripts/*.sh tests/*.sh \
            rootfs-overlay/usr/local/sbin/gemini-mkbootimg \
            rootfs-overlay/usr/local/sbin/gemini-usb-gadget \
            rootfs-overlay/usr/local/sbin/gemini-firstboot \
            rootfs-overlay/usr/local/sbin/gemini-bt-mac \
            rootfs-overlay/usr/local/sbin/gemini-wifi-watchdog \
            rootfs-overlay/usr/local/sbin/gemini-usb-current \
            rootfs-overlay/usr/local/bin/{gemini-status,gemini-sway-screen,gemini-sway-idle,wifi,menu,install-claude,claude-tmux,install-pi,pi-tmux,bright,screen-timeout,phone-help,update} \
            rootfs-overlay/etc/profile.d/zz-gemini-menu.sh \
            rootfs-overlay/etc/update-motd.d/60-gemini
          shellcheck -S warning -s sh twrp/update-binary
      - name: Python syntax
        run: python3 -m py_compile tests/*.py rootfs-overlay/usr/local/sbin/gemini-firmware-install rootfs-overlay/usr/local/sbin/gemini-powerkey rootfs-overlay/usr/local/bin/gemini-bar-status
      - name: Firmware squash test
        run: python3 -I tests/test_firmware_squash.py
      - name: Power key / buttons test
        run: python3 -I tests/test_powerkey.py
      - name: PC charging limit test
        run: bash tests/test_usb_current.sh
      - name: Boot image test
        run: bash tests/test_mkbootimg.sh
      - name: TWRP installer test
        run: sudo bash tests/test_twrp_zip.sh

  build:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      UI: ${{ inputs.ui || 'sway' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - uses: actions/checkout@v4
      - name: Host dependencies
        run: sudo ./scripts/00-host-deps.sh
      - name: Kernel
        run: sudo ./scripts/10-build-kernel.sh
      - name: Ubuntu 26.04 rootfs
        run: sudo UI="$UI" ./scripts/20-build-rootfs.sh
      - name: Images
        run: sudo ./scripts/30-make-images.sh
      - name: Boot test in QEMU (incl. installing Claude Code)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
          sudo QEMU_NET_TESTS=1 ./tests/qemu-boot.sh
      - name: TWRP zip
        run: sudo ./scripts/40-make-twrp-zip.sh
      - name: Compress
        run: |
          sudo rm -rf work/rootfs
          sudo rm -f out/rootfs.img
          sudo xz -T0 -6 out/rootfs.sparse.img
          cd out && sudo sh -c 'sha256sum *.zip boot.img rootfs.sparse.img.xz linux-image-*.deb > SHA256SUMS' && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-gemini-ubuntu-26.04-${{ env.UI }}
          path: |
            out/*.zip
            out/boot.img
            out/rootfs.sparse.img.xz
            out/linux-image-*.deb
            out/SHA256SUMS
          retention-days: 30
      - name: Release name
        id: rel
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag="${GITHUB_REF_NAME}"
          else tag="v26.04-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"; fi
          [ "$UI" = sway ] || tag="${tag}-${UI}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ubuntu 26.04 for Xiaomi Mi 5 (${{ env.UI }}) ${{ steps.rel.outputs.tag }}
          make_latest: ${{ env.UI == 'sway' }}
          body: |
            Ubuntu 26.04 LTS (server) for the Xiaomi Mi 5 (gemini), kernel 6.19 msm8996-mainline.
            Built and boot-tested in QEMU (incl. installing Claude Code) by GitHub Actions.

            **Install with TWRP** (erases Android user data; system/vendor/modem are kept):
            1. Copy `ubuntu-26.04-xiaomi-gemini-twrp.zip` to a USB OTG drive, or use `adb sideload ubuntu-26.04-xiaomi-gemini-twrp.zip`
               (if the zip is on internal storage, the installer copies it to RAM first)
            2. TWRP → Install → the zip → Reboot System
            3. The phone starts into a terminal with an on-screen keyboard (sway UI). Type `wifi` to connect;
               the first `sudo` asks for the password `ubuntu` and makes you choose a new one.
               (Console UI builds: log in `ubuntu` / `ubuntu`, the menu opens.)
            4. `install-claude`, then `claude` (or `install-pi`, then `pi` with a DeepSeek key)

            **Or with fastboot:** `fastboot flash boot boot.img` and `fastboot flash userdata rootfs.sparse.img` (unpack the .xz first).

            Easy commands on the phone: `menu`, `wifi`, `status`, `phone-help`. See docs/INSTALL.md.
          files: |
            out/*.zip
            out/boot.img
            out/rootfs.sparse.img.xz
            out/linux-image-*.deb
            out/SHA256SUMS
