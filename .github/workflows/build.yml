name: Build Mi 5 Ubuntu images

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ui:
        description: 'On-screen keyboard / UI'
        type: choice
        options: [console, sway, phosh]
        default: console

permissions:
  contents: write   # for attaching images to releases on tags

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck device-tree-compiler python3
      - name: Shellcheck
        run: |
          shellcheck -x -S warning build.sh scripts/*.sh tests/*.sh \
            rootfs-overlay/usr/local/sbin/gemini-mkbootimg \
            rootfs-overlay/usr/local/sbin/gemini-usb-gadget \
            rootfs-overlay/usr/local/sbin/gemini-firstboot \
            rootfs-overlay/usr/local/sbin/gemini-bt-mac \
            rootfs-overlay/usr/local/bin/gemini-status \
            rootfs-overlay/usr/local/bin/gemini-sway-screen \
            rootfs-overlay/etc/update-motd.d/60-gemini
      - name: Python syntax
        run: python3 -m py_compile rootfs-overlay/usr/local/sbin/gemini-firmware-install rootfs-overlay/usr/local/sbin/gemini-powerkey
      - name: Firmware squash test
        run: python3 -I tests/test_firmware_squash.py
      - name: Boot image test
        run: bash tests/test_mkbootimg.sh

  build:
    needs: test
    # Full builds take ~1-2 h: run them on tags and when started by hand.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - uses: actions/checkout@v4
      - name: Host dependencies
        run: sudo ./scripts/00-host-deps.sh
      - name: Kernel
        run: sudo ./scripts/10-build-kernel.sh
      - name: Ubuntu 26.04 rootfs
        run: sudo UI="${{ inputs.ui || 'console' }}" ./scripts/20-build-rootfs.sh
      - name: Images
        run: |
          sudo ./scripts/30-make-images.sh
          sudo rm -rf work/rootfs out/rootfs.img
          sudo xz -T0 -6 out/rootfs.sparse.img
          cd out && sudo sh -c 'sha256sum boot.img rootfs.sparse.img.xz linux-image-*.deb > SHA256SUMS'
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-gemini-ubuntu-26.04-${{ inputs.ui || 'console' }}
          path: |
            out/boot.img
            out/rootfs.sparse.img.xz
            out/linux-image-*.deb
            out/SHA256SUMS
          retention-days: 30
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/boot.img
            out/rootfs.sparse.img.xz
            out/linux-image-*.deb
            out/SHA256SUMS
